server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: đường dẫn không phải file thì trả index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File build có hash trong tên nên cache lâu được.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
