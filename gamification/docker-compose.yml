services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
  pg-lessons:            # DB của Node.js (lesson_attempts + outbox_events)
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: lessons }
    ports: ["5432:5432"]
    volumes:
      - ./node-producer/migrations:/docker-entrypoint-initdb.d:ro
      - pg-lessons-data:/var/lib/postgresql/data
  pg-core:               # DB của Spring Boot (wallet, xp_transactions, ...). Flyway tự migrate
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: core }
    ports: ["5433:5432"]
    volumes: ["pg-core-data:/var/lib/postgresql/data"]
volumes: { rabbit-data: {}, pg-lessons-data: {}, pg-core-data: {} }
