server:
  port: 8080

spring:
  application:
    name: gamification-core

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/core}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000

  jpa:
    open-in-view: false            # không giữ connection suốt request
    hibernate:
      ddl-auto: validate           # schema do Flyway quản lý, Hibernate chỉ kiểm tra
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: ${RABBIT_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto        # ack khi listener return OK; throw -> retry -> DLQ
        prefetch: 20
        concurrency: 2
        max-concurrency: 8
        default-requeue-rejected: false   # reject không requeue -> đi vào DLQ
        retry:
          enabled: true               # retry TRONG process (mỗi lần là 1 transaction mới)
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2.0
          max-interval: 10s
          # hết retry -> RejectAndDontRequeueRecoverer (mặc định) -> DLX -> DLQ

app:
  rabbit:
    exchange: gamification.events
    queue: gamification.lesson-completed.q
    routing-key: lesson.completed
    dlx: gamification.events.dlx
    dlq: gamification.lesson-completed.dlq
  xp:
    per-correct-answer: 10
    streak-bonus-threshold: 7        # bonus khi streak > 7 ngày
    streak-bonus-percent: 150        # nhân 1.5 (dùng số nguyên, tránh sai số float)

management:
  endpoints:
    web:
      exposure:
        include: health,info
